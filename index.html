<!DOCTYPE html>
  <head>
    <html lang="en">
    <meta charset="utf-8">
    <title> Pokemon Finder </title>
    <link href="index.css" rel="stylesheet">
    <link rel="shortcut icon" href="https://assets.pokemon.com/static2/_ui/img/favicon.ico">
  </head>
  <body>
 <div>   
    <h1> Find that Pokemon </h1>
    <input type= "text" id="Enter"placeholder="Enter the Pokemon name please">
    <button onclick="T()">Enter Button</button>
    <label for="shiny"> Show Shiny </label>
   <input type="checkbox" id="shiny" onchange="R()"> 
 </div>
    <div id="stats">
        <img src="https://png.pngtree.com/element_our/20190530/ourmid/pngtree-white-spot-float-image_1256405.jpg" alt="" id="Img">
      <div> 
    <p> Type: <span id="type"></span> </p>
    </div>
    <div> 
  <label for="hp">HP:</label>
    <meter id="hp" min="0" max="240" value="0" ></meter>
  </div>
       <br>
    <div>
    <label for="attack">Attack:</label>
    <meter id="attack" min="0" max="200" value="0" ></meter>
  </div>
   <br>
    <div>
    <label for="defense">Denfense:</label>
    <meter id="defense" min="0" max="255" value="0" ></meter>
  </div>
   <br>
    <div>  
    <label for="special-attack">Sp.Atk:</label>
    <meter id="special-attack" min="0" max="200" value="0" ></meter>
  </div>
    <br>
    <div>
    <label for="special-denfense">Sp.Def:</label>
    <meter id="special-defense" min="0" max="200" value="0"></meter>
  </div>
    <br>
    <div>
    <label for="speed">Speed</label>
    <meter id="speed" min="0" max="200" value="0"></meter>  
    </div>
     <div>
    <label for="total">Total:</label>
      <meter id="total"min="0" max="1200" value="0" ></meter>
  </div>
  </div>
    <div>
   <fieldset width="96" height="128">
       <legend>
    <strong>Pokemon description</strong>
    </legend>
     <p id="bomb"> </p>
    </fieldset>
</div>
    <!--this is a comment--> 
    <script src="index.js">
 </script>
  </body>
